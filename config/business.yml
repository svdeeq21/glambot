# on first contact. Use these in click-to-chat ad links:
#   wa.me/2349035144812?text=GLAM-IG  (Instagram ads)
#   wa.me/2349035144812?text=GLAM-FB  (Facebook ads)
#   wa.me/2349035144812?text=GLAM-TT  (TikTok ads)
#   wa.me/2349035144812?text=GLAM-WEB (Website button)
#   wa.me/2349035144812?text=GLAM-REF (Word-of-mouth referral)
