faqs:
  - question: "Do you come to my location?"
    answer: "Yes! Home service is available within Lagos. An additional travel fee of ₦3,000 – ₦5,000 applies depending on your location."

  - question: "Do I need to bring anything?"
    answer: "No, we bring everything! Just come with a clean face if you're booking makeup. For nails, remove any old polish beforehand."

  - question: "How do I pay?"
    answer: "We accept bank transfer and cash. A 50% deposit is required to confirm your booking."

  - question: "Can I reschedule?"
    answer: "Yes! Please reschedule at least 24 hours before your appointment. Last-minute cancellations forfeit the deposit."
